# Petal with the real Dagger executor.
#
# Why a container even for local dev: the Dagger engine is a Linux container
# and cannot be provisioned from a native Windows process. Running Petal as a
# Linux container against the same daemon keeps the dev loop identical to the
# k3s deployment (same image, same engine-over-socket pattern as DinD pods).
services:
  petal:
    build:
      context: ..
    ports:
      - "8080:8080"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      # The engine session needs writable cache dirs; distroless ships none.
      HOME: /tmp
      TMPDIR: /tmp
      TMP: /tmp
    command: ["-db", "/data/petal.db", "-executor", "dagger", "-workdir", "/src"]
    volumes:
      - petal-data:/data
      # Engine provisioning: Petal creates sibling engine containers via the
      # daemon socket (same role as the DinD sidecar in the k3s deployment).
      - /var/run/docker.sock:/var/run/docker.sock
      # Dogfood source: pipelines build from the mounted repo checkout.
      - ..:/src
    restart: unless-stopped

volumes:
  petal-data:
