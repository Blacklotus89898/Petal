# Petal with the real step-runner executor (ADR 0002).
#
# Steps run as sibling containers via the mounted daemon socket (DOCKER_HOST),
# which is also why Petal itself runs as a Linux container on Windows dev
# boxes: path handling for bind mounts is Linux-native here, same as the k3s
# deployment.
services:
  petal:
    build:
      context: ..
    ports:
      - "8080:8080"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    command: ["-db", "/data/petal.db", "-data", "/data", "-executor", "steps", "-workdir", "/src"]
    volumes:
      - petal-data:/data
      # Step containers are created as siblings via the daemon socket (same
      # role as the DinD sidecar in the k3s deployment).
      - /var/run/docker.sock:/var/run/docker.sock
      # Pipeline source: the catalog is discovered at /src/.petal/pipelines/.
      - ..:/src
      # NOTE: step containers bind-mount <dataDir>/work/<run_id> as /src, and
      # the daemon resolves that source in ITS filesystem. With the socket
      # mount above that is the host, so /data must exist on the host for
      # runs to work here — prefer the k3s deployment (dind sidecar shares
      # the same /data PVC) for exercising the step-runner.
    restart: unless-stopped

volumes:
  petal-data:
