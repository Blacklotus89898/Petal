# Sends a signed trigger to Petal on every push to main, so Petal builds the
# image with its own Dagger pipeline (Petal builds Petal).
#
# Dormant until you opt in: set repository variable PETAL_ENABLED=true and
# secrets PETAL_URL (e.g. http://192.168.0.108:30990) and PETAL_TRIGGER_TOKEN.
name: Trigger Petal pipeline

on:
  push:
    branches: [main]

jobs:
  trigger:
    if: vars.PETAL_ENABLED == 'true'
    runs-on: homelab-runner
    steps:
      - name: Send signed trigger to Petal
        env:
          PETAL_URL: ${{ secrets.PETAL_URL }}
          PETAL_TRIGGER_TOKEN: ${{ secrets.PETAL_TRIGGER_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg sha "$SHA" \
            --arg src "gha:$RUN_URL" \
            '{pipeline:"docker-image", module_fn:"build", args:{}, git_sha:$sha, source:$src}')
          sig=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$PETAL_TRIGGER_TOKEN" | awk '{print $2}')
          curl -sf -X POST "$PETAL_URL/api/triggers/github" \
            -H "Content-Type: application/json" \
            -H "X-Petal-Signature: sha256=$sig" \
            -d "$payload"
